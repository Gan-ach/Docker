services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Krasnoyarsk
    volumes:
      - /home/gan/stacks/sonarr/data:/config
      - /mnt/Media:/tv #optional
      - /mnt/Media/sonarr:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped
networks:
  dockge_default:
    external: true
